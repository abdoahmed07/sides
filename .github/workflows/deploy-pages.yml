# Builds every web app in this repo into ONE GitHub Pages site (a repo can only have one):
#   Landing page + demos  → https://abdoahmed07.github.io/sides/  (/airport/, /digits/)
#   Streak habit tracker  → https://abdoahmed07.github.io/sides/streak/
#   Kent card game        → https://abdoahmed07.github.io/sides/kent/
# One-time setup: Settings → Pages → Source: "GitHub Actions", and add repository
# variables VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions → Variables).
name: Deploy to Pages

on:
  push:
    branches: [main]
    paths: ['Habit_tracker/**', 'Kent/**', '.github/workflows/deploy-pages.yml', 'Landing/**', 'Airplane-simulator/src/**', 'Summer 2026/project-08-neural-network/weights/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm (Kent)
        uses: pnpm/action-setup@v4
        with:
          package_json_file: Kent/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Habit_tracker/package-lock.json

      - name: Build Streak
        working-directory: Habit_tracker
        run: |
          npm ci
          npm test
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Build Kent
        working-directory: Kent
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run build

      # Ubuntu's system Python refuses pip installs, so use a managed one for NumPy.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build landing page and demos
        run: |
          pip install --quiet numpy
          Landing/build.sh site

      - name: Add the apps
        run: |
          mkdir -p site/streak
          cp -r Habit_tracker/dist/. site/streak/
          mkdir -p site/kent
          cp -r Kent/apps/client/dist/. site/kent/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
